<!DOCTYPE html>
<html>
<head>
  <title>My HTML Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  font-family: 'Orbitron', monospace;
  background: #0a0a0f;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
  color: #fff;
}

h1 {
  text-align: center;
  margin-bottom: 40px;
  color: #00f0ff;
  font-size: clamp(2rem, 8vw, 3.5rem);
  font-weight: 900;
  text-shadow: 
    0 0 5px #00f0ff,
    0 0 10px #00f0ff;
  text-transform: uppercase;
  letter-spacing: 5px;
  animation: fadeIn 1s ease-in;
  position: relative;
}

h1::after {
  content: '';
  position: absolute;
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  width: 100px;
  height: 3px;
  background: linear-gradient(90deg, transparent, #ff00ff, transparent);
  box-shadow: 0 0 5px #ff00ff;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

ul {
  list-style: none;
  padding: 0;
  max-width: 400px;
  width: 100%;
  margin: auto;
  animation: slideIn 0.5s ease-out 0.3s both;
}

@keyframes slideIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

li {
  margin: 20px 0;
}

a {
  display: block;
  text-align: center;
  padding: 20px 30px;
  background: transparent;
  color: #00f0ff;
  text-decoration: none;
  font-size: 1.2rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 3px;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
}

a::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transition: 0.5s;
}

a:hover, a:active {
  color: #fff;
  text-shadow: 0 0 10px #00f0ff;
  transform: scale(1.05);
}

a:hover::before, a:active::before {
  left: 100%;
}

.subtitle {
  color: #ff00ff;
  font-size: 1rem;
  margin-bottom: 30px;
  text-shadow: 0 0 5px #ff00ff;
  letter-spacing: 3px;
  text-align: center;
  animation: fadeIn 1s ease-in 0.2s both;
}
  </style>
<base target="_blank">
</head>
<body>
  <h1>My Games</h1>
  <p class="subtitle">Select a game to play</p>
  <ul>
    <li><a href="minesweeper/">Minesweeper</a></li>
  </ul>
</body>
</html>
