<!DOCTYPE html>
<html>
<head>
  <title>My HTML Games</title>
  <style>
    body {
background: #0a0a0f;
color: #ffffff;
font-family: Arial, sans-serif;
margin: 0;
padding: 40px;
}

h1 {
text-align: center;
margin-bottom: 40px;
color: #00eaff;
font-size: 32px;
}

ul {
list-style: none;
padding: 0;
max-width: 400px;
margin: auto;
}

li {
margin: 20px 0;
}

a {
display: block;
text-align: center;
padding: 15px 20px;
background: #111122;
color: #00eaff;
text-decoration: none;
border: 2px solid #00eaff;
border-radius: 10px;
font-size: 20px;
transition: 0.3s;
box-shadow: 0 0 10px #00eaff;
}

a:hover {
background: #00eaff;
color: #000000;
box-shadow: 0 0 20px #00eaff;
}
  </style>
</head>
<body>
  <h1>My Games</h1>
  <ul>
    <li><a href="minesweeper/">Minesweeper</a></li>
  </ul>
</body>
</html>
